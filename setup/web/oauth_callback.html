<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Thicket - Sign In Complete</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h2 { margin-bottom: 0.5rem; }
    p { color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign-in complete</h2>
    <p>You can close this window.</p>
  </div>
  <script>
    // Extract the access token from the URL fragment (implicit grant flow).
    // The fragment looks like: #access_token=...&token_type=Bearer&expires_in=3600&scope=...
    (function() {
      var params = {};
      var fragment = window.location.hash.substring(1);
      fragment.split('&').forEach(function(pair) {
        var parts = pair.split('=');
        if (parts.length === 2) {
          params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
        }
      });

      var message = {};
      if (params['access_token']) {
        message['access_token'] = params['access_token'];
      } else if (params['error']) {
        message['error'] = params['error'];
      } else {
        message['error'] = 'no_token';
      }

      // Send the token back to the opener window.
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
      }
    })();
  </script>
</body>
</html>
